[project]
name = "ai-engineering-workbench"
version = "0.0.0"
description = "Local-first control plane for AI-assisted engineering workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Workbench contributors" }]
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "sqlalchemy>=2.0.40",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
workbench = "workbench.cli.main:app"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["workbench"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "apps/dashboard/node_modules"]
